<!DOCTYPE html>
<html>
<head>
  <title>Utility PDF Extractor (Drive OCR)</title>
</head>
<body>
  <h2>Upload Utility PDF</h2>
  <input type="file" id="pdfFileInput" accept="application/pdf" />
  <button onclick="processPDF()">Upload and Extract</button>

  <p id="statusMsg"></p>

  <script>
    const SCRIPT_URL = "YOUR_DEPLOYED_WEB_APP_URL"; // Replace with your deployment URL

    async function processPDF() {
      const fileInput = document.getElementById("pdfFileInput");
      const statusMsg = document.getElementById("statusMsg");

      if (!fileInput.files.length) {
        statusMsg.innerText = "Please select a PDF file first.";
        return;
      }

      const file = fileInput.files[0];
      statusMsg.innerText = "Processing OCR via Google Drive... Please wait.";

      const reader = new FileReader();
      reader.onload = async function(e) {
        // Strip data URL prefix to leave pure Base64 string
        const base64Data = e.target.result.split(',')[1];

        try {
          const response = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({
              fileName: file.name,
              fileData: base64Data
            })
          });

          const res = await response.json();
          if (res.status === "Success") {
            statusMsg.innerText = `Success! Extracted ${res.extractedCount} fields into Google Sheet.`;
          } else {
            statusMsg.innerText = `Error: ${res.message}`;
          }
        } catch (err) {
          statusMsg.innerText = `Network/API Error: ${err.message}`;
        }
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
